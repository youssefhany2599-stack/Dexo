function add(c,txt){const d=el("div","m "+c,txt);if(c=="b"){const r=el("div","r"),i=el("img","av");i.src=AV;i.alt="Dexo";r.appendChild(i);r.appendChild(d);log.appendChild(r)}else log.appendChild(d);log.scrollTop=log.scrollHeight;return d}
function show(b){const d=add("b",b.t);
 if(b.steps){const o=el("ol");b.steps.forEach(s=>o.appendChild(el("li","",s)));d.appendChild(o)}
 if(b.w)d.appendChild(el("div","wr","⚠️ "+b.w));
 if(b.f)d.appendChild(el("div","fn",b.f));
 if(b.rep){d.appendChild(el("pre","rp",b.rep));const c=el("button","cp","نسخ التقرير");c.type="button";c.onclick=()=>{const done=()=>c.textContent="تم النسخ ✓";try{navigator.clipboard.writeText(b.rep).then(done,()=>{})}catch(e){const a=el("textarea");a.value=b.rep;document.body.appendChild(a);a.select();document.execCommand("copy");a.remove();done()}};d.appendChild(c)}
 if(b.chips){const c=el("div","chips");b.chips.forEach(q=>{const k=el("button","",q);k.type="button";k.onclick=()=>send(q);c.appendChild(k)});d.appendChild(c)}
 log.scrollTop=log.scrollHeight}
function send(q){q=(q||t.value).trim();if(!q)return;t.value="";
 const flag=/\d{14}/.test(q)||/(otp|كود|pin).{0,10}\d{4,6}/i.test(q),m=q.replace(/\d{14}/g,"••••").replace(/((?:otp|كود|pin)\D{0,10})\d{4,6}/gi,"$1••••");
 add("u",m);reply(m,flag).forEach(show);ctx();t.focus()}
function intro(){log.innerHTML="";st.prog=st.intent=st.aw=null;ctx();
 show({t:"أهلاً بيك، أنا Dexo 👋 مساعدك في الـ DMC، موجود لو محتاج أي مساعدة.",chips:["الفاوتشر مش راضي يتحرق","إزاي أحرق كوبون CIB؟","الـ OTP مش بيوصل","فودافون ريد مش شغال","DMC مش بيفتح","عميل عايز يرجّع جزء من عملية Red"]})}
document.getElementById("f").onsubmit=e=>{e.preventDefault();send()};
t.onkeydown=e=>{if(e.key=="Enter"&&!e.shiftKey){e.preventDefault();send()}};
document.getElementById("rs").onclick=intro;
cx.lastChild.onclick=()=>{st.prog=null;ctx()};
intro()}else module.exports={reply,st};
</script>
